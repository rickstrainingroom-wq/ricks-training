<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICKS – Training Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F5F2;
    --cream-dim:#D9D9D4;
    --green-deep:#0D0D0E;
    --green:#1B1B1C;
    --green-mid:#2A2A2C;
    --green-line: rgba(245,245,242,0.14);
    --gold:#C9A24B;
    --gold-bright:#E4C374;
    --ink:#0D0D0E;
    --red:#E2574C;
    --radius:18px;
    --shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(1100px 700px at 50% 115%, rgba(255,255,255,0.035), transparent 60%),
      var(--green-deep);
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.03em;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:22px clamp(16px,4vw,48px);
    border-bottom:1px solid var(--green-line);
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand img{
    height:clamp(112px,13.5vw,168px);
    width:auto;
    display:block;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .clock-block{text-align:right;}
  .clock{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:0.05em;
  }
  .date-line{
    font-size:11px;
    color:rgba(244,240,230,0.55);
    text-transform:capitalize;
  }
  .slot-pill{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(201,162,75,0.12);
    border:1px solid rgba(201,162,75,0.4);
    color:var(--gold-bright);
    padding:8px 14px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .slot-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-bright); flex:none;}

  /* ---------- Layout ---------- */
  main.grid{
    flex:1;
    display:grid;
    grid-template-columns: minmax(320px, 1.15fr) minmax(340px, 1fr);
    gap:clamp(14px,2.4vw,28px);
    padding:clamp(16px,3vw,32px) clamp(16px,4vw,48px) 40px;
    align-items:start;
  }
  @media (max-width: 920px){
    main.grid{grid-template-columns:1fr;}
  }

  .card{
    background:linear-gradient(180deg, rgba(244,240,230,0.05), rgba(244,240,230,0.02));
    border:1px solid var(--green-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(18px,2.4vw,28px);
  }

  /* ---------- Plan card ---------- */
  .plan-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .plan-head h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(24px,2.8vw,30px);
    letter-spacing:0.03em;
    margin:0;
    color:var(--gold-bright);
  }
  .plan-date-picker{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:rgba(244,240,230,0.6);
  }
  .plan-date-picker input[type="date"]{
    background:rgba(244,240,230,0.06);
    border:1px solid var(--green-line);
    color:var(--cream);
    border-radius:8px;
    padding:6px 8px;
    font-family:'DM Sans', sans-serif;
    font-size:12px;
    color-scheme:dark;
  }
  .save-state{
    font-size:11px;
    color:rgba(244,240,230,0.4);
    margin-bottom:14px;
    min-height:14px;
  }
  .focus-row{
    margin-bottom:16px;
  }
  .focus-row label, .settings-row label{
    display:block;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(244,240,230,0.5);
    margin-bottom:6px;
  }
  .focus-row input{
    width:100%;
    background:rgba(244,240,230,0.06);
    border:1px solid var(--green-line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--cream);
    font-size:18px;
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.03em;
  }
  .focus-row input::placeholder{color:rgba(244,240,230,0.35); font-family:'DM Sans',sans-serif; font-weight:400; font-size:14px;}

  .settings-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .settings-row .field input{
    width:100%;
    background:rgba(244,240,230,0.06);
    border:1px solid var(--green-line);
    border-radius:9px;
    padding:9px 10px;
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    font-weight:600;
  }
  .settings-row .field span.unit{
    font-size:10px;
    color:rgba(244,240,230,0.4);
    display:block;
    margin-top:3px;
  }

  .station-table-head{
    display:grid;
    grid-template-columns:26px 1.4fr 90px 32px;
    gap:8px;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(244,240,230,0.4);
    padding:0 2px 6px;
  }
  #stationList{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .st-row{
    display:grid;
    grid-template-columns:26px 1.4fr 90px 32px;
    gap:8px;
    align-items:center;
  }
  .st-num{
    font-family:'Bebas Neue', sans-serif;
    font-size:17px;
    color:var(--gold);
    text-align:center;
  }
  .st-row input[type="text"]{
    background:rgba(244,240,230,0.05);
    border:1px solid var(--green-line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    width:100%;
  }
  .st-time{
    display:flex;
    align-items:center;
    gap:3px;
    background:rgba(244,240,230,0.05);
    border:1px solid var(--green-line);
    border-radius:8px;
    padding:0 8px;
  }
  .st-time input[type="number"]{
    width:38px;
    background:transparent;
    border:none;
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    padding:9px 0;
    text-align:right;
  }
  .st-time span{font-size:11px; color:rgba(244,240,230,0.4);}
  .st-row input:focus, .focus-row input:focus, .settings-row input:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(201,162,75,0.08);
  }
  .st-del{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--green-line);
    background:transparent;
    color:rgba(244,240,230,0.5);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, color .15s, border-color .15s;
  }
  .st-del:hover{background:rgba(185,80,63,0.15); color:var(--red); border-color:rgba(185,80,63,0.4);}

  .plan-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .btn{
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:10px;
    padding:11px 18px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .12s ease, background .15s, border-color .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:var(--gold); color:var(--green-deep); border-color:var(--gold);}
  .btn-gold:hover{background:var(--gold-bright);}
  .btn-ghost{background:transparent; color:var(--cream); border-color:var(--green-line);}
  .btn-ghost:hover{border-color:rgba(244,240,230,0.4);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .empty-hint{
    font-size:13px;
    color:rgba(244,240,230,0.45);
    padding:10px 0 6px;
  }

  /* ---------- Timer card ---------- */
  .timer-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .tabs{
    display:flex;
    gap:6px;
    background:rgba(244,240,230,0.05);
    border:1px solid var(--green-line);
    border-radius:999px;
    padding:4px;
    margin-bottom:20px;
    align-self:center;
  }
  .tab-btn{
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.04em;
    padding:9px 20px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:rgba(244,240,230,0.55);
    cursor:pointer;
  }
  .tab-btn.active{background:var(--gold); color:var(--green-deep);}

  .phase-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(244,240,230,0.06);
    border:1px solid var(--green-line);
    padding:6px 14px;
    border-radius:999px;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(244,240,230,0.6);
    margin-bottom:14px;
  }
  .phase-pill.work{color:var(--gold-bright); border-color:rgba(201,162,75,0.4);}
  .phase-pill.rest{color:#8fb79c; border-color:rgba(143,183,156,0.35);}

  .ring-wrap{
    position:relative;
    width:min(300px, 66vw);
    height:min(300px, 66vw);
    margin:2px 0 10px;
  }
  .ring-wrap svg{width:100%;height:100%; transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:rgba(244,240,230,0.09); stroke-width:14;}
  .ring-fg{
    fill:none;
    stroke:var(--gold);
    stroke-width:14;
    stroke-linecap:round;
    transition:stroke-dashoffset .18s linear, stroke .25s;
  }
  .ring-fg.rest{stroke:#6f9a80;}
  .ring-fg.warn{stroke:var(--red);}
  .ring-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 20px;
    text-align:center;
  }
  .time-readout{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(46px, 8vw, 66px);
    letter-spacing:0.02em;
    line-height:1;
  }
  .time-readout.warn{color:var(--red);}
  .phase-name{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(16px,2vw,20px);
    letter-spacing:0.03em;
    color:var(--cream);
    margin-top:4px;
    max-width:220px;
  }
  .next-up{
    font-size:11px;
    color:rgba(244,240,230,0.4);
    margin-bottom:16px;
    min-height:14px;
  }
  .next-up b{color:rgba(244,240,230,0.65); font-weight:600;}

  .quick-adjust{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .quick-adjust button{
    width:44px; height:38px;
    border-radius:9px;
    border:1px solid var(--green-line);
    background:rgba(244,240,230,0.05);
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .quick-adjust button:hover{border-color:var(--gold);}

  .presets{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
  }
  .chip{
    font-family:'DM Sans', sans-serif;
    font-size:12px;
    font-weight:600;
    padding:8px 13px;
    border-radius:999px;
    border:1px solid var(--green-line);
    background:rgba(244,240,230,0.04);
    color:var(--cream);
    cursor:pointer;
  }
  .chip:hover{border-color:var(--gold);}
  .chip.active{background:var(--gold); color:var(--green-deep); border-color:var(--gold);}

  .custom-set{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
  }
  .custom-set input[type="number"]{
    width:58px;
    text-align:center;
    background:rgba(244,240,230,0.06);
    border:1px solid var(--green-line);
    border-radius:8px;
    padding:9px 4px;
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
  }
  .custom-set span{color:rgba(244,240,230,0.5); font-size:13px;}

  .timer-controls{
    display:flex;
    gap:10px;
    width:100%;
    justify-content:center;
    flex-wrap:wrap;
  }
  .timer-controls .btn{min-width:96px;}
  .btn-start{background:var(--green-mid); color:var(--cream); border-color:var(--green-mid);}
  .btn-start:hover{background:#356b49;}

  .fullscreen-toggle{
    margin-top:18px;
    background:none;
    border:none;
    color:rgba(244,240,230,0.4);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .fullscreen-toggle:hover{color:var(--gold-bright);}

  .tab-panel{display:none; width:100%;}
  .tab-panel.active{display:flex; flex-direction:column; align-items:center;}

  .circuit-empty{
    font-size:13px;
    color:rgba(244,240,230,0.45);
    padding:30px 10px;
    line-height:1.6;
  }

  /* ---------- Fullscreen overlay ---------- */
  #fsOverlay{
    position:fixed; inset:0;
    background:var(--green-deep);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    flex-direction:column;
    padding:24px;
  }
  #fsOverlay.active{display:flex;}
  #fsOverlay img.fs-logo{height:clamp(90px,11vw,140px); margin-bottom:22px;}
  #fsOverlay .fs-phase-pill{margin-bottom:6px;}
  #fsOverlay .fs-focus{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(20px,3vw,28px);
    color:var(--gold-bright);
    letter-spacing:0.05em;
    margin-bottom:22px;
    text-align:center;
  }
  .fs-ring-wrap{
    position:relative;
    width:min(64vh, 78vw);
    height:min(64vh, 78vw);
  }
  .fs-ring-wrap svg{width:100%;height:100%; transform:rotate(-90deg);}
  #fsOverlay .time-readout{font-size:min(18vh, 18vw);}
  #fsOverlay .phase-name{font-size:min(4vh,4vw); max-width:80vw;}
  #fsOverlay .next-up{font-size:14px; margin-top:20px;}
  #fsOverlay .timer-controls{margin-top:30px;}
  .fs-close{
    position:absolute;
    top:22px; right:26px;
    background:none;
    border:1px solid var(--green-line);
    color:var(--cream);
    width:40px;height:40px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
  }
  .fs-close:hover{border-color:var(--gold);}
  .flash{animation:flashPulse .5s ease-in-out infinite alternate;}
  @keyframes flashPulse{
    from{background:var(--green-deep);}
    to{background:#2a1512;}
  }

  footer{
    text-align:center;
    font-size:11px;
    color:rgba(244,240,230,0.3);
    padding:18px 16px 26px;
  }
  footer span{color:var(--gold);}


/* =========================================================
   LG webOS / older Smart-TV browser compatibility fallbacks
   Uses only broadly supported CSS (no variables/clamp/grid).
   ========================================================= */
body{
  margin:0;
  background:#0D0D0E;
  color:#F5F5F2;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}
.display,.clock,.plan-head h2,.focus-row input,.st-num,.time-readout,.phase-name,.fs-focus{
  font-family:Impact,'Arial Narrow',Arial,sans-serif;
}
.topbar{
  display:block;
  overflow:hidden;
  padding:18px 36px;
  border-bottom:1px solid #2f2f31;
  min-height:120px;
}
.brand{float:left;display:block;}
.brand img{height:115px;width:auto;display:block;}
.topbar-right{float:right;display:block;text-align:right;padding-top:25px;}
.clock-block{display:inline-block;vertical-align:middle;margin-right:18px;}
.clock{font-size:28px;color:#F5F5F2;}
.date-line{font-size:12px;color:#999;}
.slot-pill{
  display:inline-block;vertical-align:middle;
  background:#211d14;border:1px solid #806a36;color:#E4C374;
  padding:10px 16px;border-radius:24px;font-size:13px;
}
.slot-pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E4C374;margin-right:8px;}
main.grid{display:block;overflow:hidden;padding:24px 36px 36px;}
main.grid > .card{
  background:#171718;border:1px solid #303032;border-radius:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);padding:22px;
}
main.grid > .card:first-child{float:left;width:54%;}
main.grid > .timer-card{float:right;width:40%;}
.plan-head{display:block;overflow:hidden;margin-bottom:8px;}
.plan-head h2{float:left;font-size:30px;color:#E4C374;margin:0;}
.plan-date-picker{float:right;font-size:12px;color:#999;}
.plan-date-picker input[type=date]{background:#222;color:#F5F5F2;border:1px solid #3a3a3c;border-radius:8px;padding:6px 8px;}
.save-state{font-size:11px;color:#777;margin-bottom:14px;min-height:14px;}
.focus-row{margin-bottom:16px;}
.focus-row label,.settings-row label{display:block;font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;}
.focus-row input,.settings-row .field input,.st-row input[type=text],.custom-set input[type=number]{
  background:#222;color:#F5F5F2;border:1px solid #3a3a3c;border-radius:8px;
}
.focus-row input{width:100%;padding:11px 12px;font-size:18px;}
.settings-row{display:block;overflow:hidden;margin-bottom:18px;}
.settings-row .field{float:left;width:31%;margin-right:2%;}
.settings-row .field input{width:100%;padding:9px 8px;font-size:14px;}
.settings-row .field span.unit{display:block;font-size:10px;color:#777;margin-top:3px;}
.station-table-head,.st-row{display:block;overflow:hidden;}
.station-table-head{font-size:10px;color:#777;text-transform:uppercase;padding-bottom:6px;}
.station-table-head > *,.st-row > *{float:left;}
.station-table-head > *:nth-child(1),.st-row > *:nth-child(1){width:6%;}
.station-table-head > *:nth-child(2),.st-row > *:nth-child(2){width:55%;}
.station-table-head > *:nth-child(3),.st-row > *:nth-child(3){width:27%;}
.station-table-head > *:nth-child(4),.st-row > *:nth-child(4){width:8%;}
#stationList{display:block;margin-bottom:14px;}
.st-row{margin-bottom:8px;}
.st-num{font-size:18px;color:#C9A24B;text-align:center;padding-top:10px;}
.st-row input[type=text]{width:96%;padding:10px 10px;font-size:14px;}
.st-time{background:#222;border:1px solid #3a3a3c;border-radius:8px;padding:0 6px;white-space:nowrap;}
.st-time input[type=number]{width:48px;background:transparent;border:0;color:#F5F5F2;padding:9px 0;font-size:14px;text-align:right;}
.st-time span{font-size:11px;color:#777;}
.st-del{width:32px;height:32px;margin-top:2px;background:transparent;color:#aaa;border:1px solid #3a3a3c;border-radius:8px;}
.plan-actions{display:block;margin-top:8px;}
.btn{display:inline-block;font-family:Arial,sans-serif;font-weight:bold;font-size:13px;border-radius:9px;padding:10px 16px;margin:4px;border:1px solid #444;cursor:pointer;}
.btn-gold{background:#C9A24B;color:#0D0D0E;border-color:#C9A24B;}
.btn-ghost{background:#171718;color:#F5F5F2;border-color:#3a3a3c;}
.btn-start{background:#2A2A2C;color:#F5F5F2;border-color:#444;}
.timer-card{text-align:center;}
.tabs{display:block;background:#202021;border:1px solid #333;border-radius:24px;padding:4px;margin:0 auto 18px;width:250px;}
.tab-btn{display:inline-block;background:transparent;color:#aaa;border:0;border-radius:20px;padding:9px 16px;font-weight:bold;font-size:12px;}
.tab-btn.active{background:#C9A24B;color:#0D0D0E;}
.tab-panel{display:none;width:100%;text-align:center;}
.tab-panel.active{display:block;}
.phase-pill{display:inline-block;background:#202021;border:1px solid #333;border-radius:20px;padding:6px 13px;font-size:11px;color:#aaa;margin-bottom:12px;}
.phase-pill.work{color:#E4C374;border-color:#806a36;}
.phase-pill.rest{color:#8fb79c;border-color:#496b54;}
.ring-wrap{position:relative;width:280px;height:280px;margin:4px auto 12px;}
.ring-wrap svg{width:280px;height:280px;transform:rotate(-90deg);-webkit-transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:#29292b;stroke-width:14;}
.ring-fg{fill:none;stroke:#C9A24B;stroke-width:14;stroke-linecap:round;}
.ring-fg.rest{stroke:#6f9a80}.ring-fg.warn{stroke:#E2574C}
.ring-center{position:absolute;left:0;top:0;width:100%;height:100%;text-align:center;padding-top:92px;}
.time-readout{font-size:64px;line-height:1;color:#F5F5F2;}
.time-readout.warn{color:#E2574C;}
.phase-name{font-size:20px;color:#F5F5F2;margin-top:4px;}
.next-up{font-size:11px;color:#777;margin-bottom:14px;min-height:14px;}
.quick-adjust,.presets,.custom-set,.timer-controls{display:block;text-align:center;margin-bottom:14px;}
.quick-adjust button,.chip{display:inline-block;margin:3px;background:#202021;color:#F5F5F2;border:1px solid #3a3a3c;border-radius:9px;padding:8px 12px;}
.chip{border-radius:20px}.chip.active{background:#C9A24B;color:#0D0D0E;border-color:#C9A24B;}
.custom-set input[type=number]{width:58px;text-align:center;padding:9px 4px;color:#F5F5F2;}
.fullscreen-toggle{margin-top:14px;background:none;border:0;color:#888;font-size:11px;text-decoration:underline;}
footer{text-align:center;font-size:11px;color:#666;padding:15px;}
footer span{color:#C9A24B;}
#fsOverlay{position:fixed;left:0;top:0;right:0;bottom:0;background:#0D0D0E;display:none;text-align:center;z-index:999;padding:20px;}
#fsOverlay.active{display:block;}
#fsOverlay img.fs-logo{height:100px;width:auto;margin:8px auto 10px;display:block;}
#fsOverlay .fs-ring-wrap{position:relative;width:500px;height:500px;margin:0 auto;}
#fsOverlay .fs-ring-wrap svg{width:500px;height:500px;transform:rotate(-90deg);-webkit-transform:rotate(-90deg);}
#fsOverlay .ring-center{padding-top:165px;}
#fsOverlay .time-readout{font-size:130px;}
#fsOverlay .phase-name{font-size:28px;}
#fsOverlay .next-up{font-size:14px;margin-top:12px;}
.fs-close{position:absolute;right:24px;top:20px;width:40px;height:40px;border-radius:20px;background:#171718;color:#fff;border:1px solid #444;}
@media (max-width:920px){
  .topbar{padding:18px 20px;min-height:0;}
  .brand,.topbar-right{float:none;text-align:left;}
  .brand img{height:110px;}
  .topbar-right{padding-top:8px;}
  main.grid{padding:16px;}
  main.grid > .card:first-child,main.grid > .timer-card{float:none;width:auto;margin-bottom:16px;}
  .settings-row .field{float:none;width:auto;margin:0 0 10px;}
}

</style>
</head>

    /* ================= Tabs ================= */
    var tabCircuitBtn = document.getElementById('tabCircuitBtn');
    var tabFreeBtn = document.getElementById('tabFreeBtn');
    var panelCircuit = document.getElementById('panelCircuit');
    var panelFree = document.getElementById('panelFree');

    /* ================= Shared beep ================= */
    function beep(pattern) {
        try {
            var ctx_1 = new (window.AudioContext || window.webkitAudioContext)();
            var now_1 = ctx_1.currentTime;
            pattern.forEach(function (_a) {
                var t = _a.t, f = _a.f;
                var osc = ctx_1.createOscillator();
                var gain = ctx_1.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0.0001, now_1 + t);
                gain.gain.exponentialRampToValueAtTime(0.3, now_1 + t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now_1 + t + 0.2);
                osc.connect(gain).connect(ctx_1.destination);
                osc.start(now_1 + t);
                osc.stop(now_1 + t + 0.25);
            });
        }
        catch (e) { /* ignore */ }
    }
    function beepShort() { beep([{ t: 0, f: 880 }]); }
    function beepFinish() { beep([{ t: 0, f: 880 }, { t: 0.22, f: 880 }, { t: 0.44, f: 1046.5 }]); }
    function fmt(sec) {
        sec = Math.max(0, Math.ceil(sec));
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    var RADIUS = 88;
    var CIRC = 2 * Math.PI * RADIUS;
    [document.getElementById('cRingFg'), document.getElementById('fRingFg'), document.getElementById('fsRingFg')]
        .forEach(function (el) { el.style.strokeDasharray = CIRC; });
    /* ================= CIRCUIT ENGINE ================= */
    var cRingFg = document.getElementById('cRingFg');
    var cTimeReadout = document.getElementById('cTimeReadout');
    var cPhaseName = document.getElementById('cPhaseName');
    var cPhasePill = document.getElementById('cPhasePill');
    var cPhaseLabel = document.getElementById('cPhaseLabel');
    var cNextUp = document.getElementById('cNextUp');
    var cStartBtn = document.getElementById('cStartBtn');
    var cSkipBtn = document.getElementById('cSkipBtn');
    var cResetBtn = document.getElementById('cResetBtn');
    var fsRingFg = document.getElementById('fsRingFg');
    var fsTimeReadout = document.getElementById('fsTimeReadout');
    var fsPhaseName = document.getElementById('fsPhaseName');
    var fsPhasePill = document.getElementById('fsPhasePill');
    var fsPhaseLabel = document.getElementById('fsPhaseLabel');
    var fsNextUp = document.getElementById('fsNextUp');
    var fsFocus = document.getElementById('fsFocus');
    var fsStartBtn = document.getElementById('fsStartBtn');
    var fsSkipBtn = document.getElementById('fsSkipBtn');
    var fsResetBtn = document.getElementById('fsResetBtn');
    var circuitSeq = [];
    var circuitIndex = -1;
    var circuitRunning = false;
    var circuitEndAt = null;
    var circuitPhaseMs = 0;
    var circuitRaf = null;
    var circuitFinished = false;
    function buildSequence(plan) {
        var seq = [];
        var stations = plan.stations.filter(function (s) { return (s.name && s.name.trim()) || s.seconds; });
        if (stations.length === 0)
            return seq;
        var _loop_1 = function (r) {
            stations.forEach(function (st, i) {
                seq.push({
                    type: 'work', round: r, totalRounds: plan.rounds,
                    stationIndex: i + 1, totalStations: stations.length,
                    name: st.name && st.name.trim() ? st.name.trim() : ('Station ' + (i + 1)),
                    seconds: Math.max(5, st.seconds || 60)
                });
                var isLastStationInRound = i === stations.length - 1;
                if (!isLastStationInRound && plan.restStation > 0) {
                    seq.push({ type: 'rest', label: 'Pause', seconds: plan.restStation, round: r });
                }
            });
            var isLastRound = r === plan.rounds;
            if (!isLastRound && plan.restRound > 0) {
                seq.push({ type: 'roundrest', label: 'Rundenpause', seconds: plan.restRound, round: r });
            }
        };
        for (var r = 1; r <= plan.rounds; r++) {
            _loop_1(r);
        }
        return seq;
    }
    function rebuildCircuitFromPlan() {
        stopCircuit();
        circuitSeq = buildSequence(currentPlan);
        circuitIndex = -1;
        circuitFinished = false;
        var hasStations = circuitSeq.length > 0;
        cStartBtn.disabled = !hasStations;
        cSkipBtn.disabled = !hasStations;
        fsStartBtn.disabled = !hasStations;
        fsSkipBtn.disabled = !hasStations;
        paintCircuitIdle(hasStations);
    }
    function paintCircuitIdle(hasStations) {
        var label = hasStations ? "Bereit" : "Kein Zirkel geplant";
        cPhaseLabel.textContent = label;
        fsPhaseLabel.textContent = label;
        cPhasePill.className = 'phase-pill';
        fsPhasePill.className = 'phase-pill fs-phase-pill';
        var firstText = hasStations ? circuitSeq[0].name || circuitSeq[0].label : "Füg Stationen im Plan hinzu";
        cPhaseName.textContent = hasStations ? ("Runde 1/" + currentPlan.rounds + " · " + firstText) : "Zirkel bereit";
        fsPhaseName.textContent = cPhaseName.textContent;
        var totalSec = hasStations ? circuitSeq[0].seconds : 0;
        cTimeReadout.textContent = fmt(totalSec);
        fsTimeReadout.textContent = fmt(totalSec);
        cRingFg.classList.remove('rest', 'warn');
        fsRingFg.classList.remove('rest', 'warn');
        cRingFg.style.strokeDashoffset = 0;
        fsRingFg.style.strokeDashoffset = 0;
        cNextUp.textContent = hasStations ? "" : "";
        fsNextUp.textContent = "";
        cStartBtn.textContent = "Start";
        fsStartBtn.textContent = "Start";
    }
    function describePhase(p) {
        if (!p)
            return "";
        if (p.type === 'work')
            return "Runde " + p.round + "/" + p.totalRounds + " · Station " + p.stationIndex + "/" + p.totalStations + ": " + p.name;
        if (p.type === 'rest')
            return "Runde " + p.round + " · Pause";
        if (p.type === 'roundrest')
            return "Rundenpause";
        return "";
    }
    function shortLabel(p) {
        if (!p)
            return "";
        if (p.type === 'work')
            return p.name;
        return p.label || 'Pause';
    }
    function paintCircuitPhase() {
        var p = circuitSeq[circuitIndex];
        var remSec = Math.max(0, circuitEndAt !== null ? (circuitEndAt - performance.now()) / 1000 : circuitPhaseMs / 1000);
        var totalSec = p.seconds;
        var frac = totalSec > 0 ? Math.max(0, remSec / totalSec) : 0;
        var offset = CIRC * (1 - frac);
        cRingFg.style.strokeDashoffset = offset;
        fsRingFg.style.strokeDashoffset = offset;
        var isRest = p.type !== 'work';
        cRingFg.classList.toggle('rest', isRest);
        fsRingFg.classList.toggle('rest', isRest);
        var warn = remSec <= 5 && remSec > 0;
        cRingFg.classList.toggle('warn', warn && !isRest);
        fsRingFg.classList.toggle('warn', warn && !isRest);
        cTimeReadout.classList.toggle('warn', warn && !isRest);
        fsTimeReadout.classList.toggle('warn', warn && !isRest);
        var text = fmt(remSec);
        cTimeReadout.textContent = text;
        fsTimeReadout.textContent = text;
        var desc = describePhase(p);
        cPhaseName.textContent = desc;
        fsPhaseName.textContent = desc;
        cPhaseLabel.textContent = isRest ? "Pause" : "Station";
        fsPhaseLabel.textContent = isRest ? "Pause" : "Station";
        cPhasePill.className = 'phase-pill ' + (isRest ? 'rest' : 'work');
        fsPhasePill.className = 'phase-pill fs-phase-pill ' + (isRest ? 'rest' : 'work');
        var nextP = circuitSeq[circuitIndex + 1];
        var nextText = nextP ? ("Weiter: " + shortLabel(nextP) + " (" + fmt(nextP.seconds) + ")") : "Letzte Phase";
        cNextUp.innerHTML = "Weiter: <b>" + (nextP ? shortLabel(nextP) : "Zirkel Ende") + "</b>" + (nextP ? " · " + fmt(nextP.seconds) : "");
        fsNextUp.innerHTML = cNextUp.innerHTML;
        cStartBtn.textContent = circuitRunning ? "Pause" : "Start";
        fsStartBtn.textContent = circuitRunning ? "Pause" : "Start";
    }
    function circuitTick() {
        if (!circuitRunning)
            return;
        var remMs = circuitEndAt - performance.now();
        if (remMs <= 0) {
            advanceCircuit();
            return;
        }
        paintCircuitPhase();
        circuitRaf = requestAnimationFrame(circuitTick);
    }
    function startCircuitPhase() {
        var p = circuitSeq[circuitIndex];
        circuitPhaseMs = p.seconds * 1000;
        circuitEndAt = performance.now() + circuitPhaseMs;
        beepShort();
        paintCircuitPhase();
        circuitRaf = requestAnimationFrame(circuitTick);
    }
    function advanceCircuit() {
        circuitIndex++;
        if (circuitIndex >= circuitSeq.length) {
            finishCircuit();
            return;
        }
        startCircuitPhase();
    }
    function startCircuit() {
        if (circuitSeq.length === 0)
            return;
        if (circuitFinished) {
            circuitIndex = -1;
            circuitFinished = false;
        }
        circuitRunning = true;
        if (circuitIndex < 0) {
            circuitIndex = 0;
            startCircuitPhase();
        }
        else {
            // resume from pause
            circuitEndAt = performance.now() + circuitPhaseMs;
            circuitRaf = requestAnimationFrame(circuitTick);
        }
        cStartBtn.textContent = "Pause";
        fsStartBtn.textContent = "Pause";
    }
    function pauseCircuit() {
        circuitRunning = false;
        cancelAnimationFrame(circuitRaf);
        if (circuitIndex >= 0 && circuitEndAt !== null) {
            circuitPhaseMs = Math.max(0, circuitEndAt - performance.now());
        }
        cStartBtn.textContent = "Start";
        fsStartBtn.textContent = "Start";
    }
    function stopCircuit() {
        circuitRunning = false;
        cancelAnimationFrame(circuitRaf);
        fsOverlayEl.classList.remove('flash');
    }
    function skipCircuit() {
        if (circuitSeq.length === 0)
            return;
        if (circuitIndex < 0) {
            circuitIndex = 0;
        }
        if (circuitRunning) {
            advanceCircuit();
        }
        else {
            circuitIndex++;
            if (circuitIndex >= circuitSeq.length) {
                circuitIndex = circuitSeq.length - 1;
                finishCircuit(true);
                return;
            }
            var p = circuitSeq[circuitIndex];
            circuitPhaseMs = p.seconds * 1000;
            circuitEndAt = null;
            paintCircuitPhase();
        }
    }
    function finishCircuit(silent) {
        circuitRunning = false;
        circuitFinished = true;
        cancelAnimationFrame(circuitRaf);
        cPhaseLabel.textContent = "Fertig";
        fsPhaseLabel.textContent = "Fertig";
        cPhasePill.className = 'phase-pill';
        fsPhasePill.className = 'phase-pill fs-phase-pill';
        cPhaseName.textContent = "Zirkel geschafft 💪";
        fsPhaseName.textContent = "Zirkel geschafft 💪";
        cTimeReadout.textContent = "00:00";
        fsTimeReadout.textContent = "00:00";
        cRingFg.style.strokeDashoffset = CIRC;
        fsRingFg.style.strokeDashoffset = CIRC;
        cRingFg.classList.remove('rest', 'warn');
        fsRingFg.classList.remove('rest', 'warn');
        cNextUp.textContent = "";
        fsNextUp.textContent = "";
        cStartBtn.textContent = "Start";
        fsStartBtn.textContent = "Start";
        if (!silent) {
            beepFinish();
            if (fsOverlayEl.classList.contains('active')) {
                fsOverlayEl.classList.add('flash');
                setTimeout(function () { return fsOverlayEl.classList.remove('flash'); }, 3000);
            }
        }
    }
    function resetCircuit() {
        stopCircuit();
        circuitIndex = -1;
        circuitFinished = false;
        circuitPhaseMs = 0;
        circuitEndAt = null;
        paintCircuitIdle(circuitSeq.length > 0);
    }
    cStartBtn.addEventListener('click', function () { return circuitRunning ? pauseCircuit() : startCircuit(); });
    fsStartBtn.addEventListener('click', function () { return circuitRunning ? pauseCircuit() : startCircuit(); });
    cSkipBtn.addEventListener('click', skipCircuit);
    fsSkipBtn.addEventListener('click', skipCircuit);
    cResetBtn.addEventListener('click', resetCircuit);
    fsResetBtn.addEventListener('click', resetCircuit);
    /* ================= FREE TIMER (manual) ================= */
    var fRingFg = document.getElementById('fRingFg');
    var fTimeReadout = document.getElementById('fTimeReadout');
    var fTimeStatus = document.getElementById('fTimeStatus');
    var fStartBtn = document.getElementById('fStartBtn');
    var fResetBtn = document.getElementById('fResetBtn');
    var fPresetsWrap = document.getElementById('fPresets');
    var fTotalSec = 60;
    var fRemainingMs = 60000;
    var fRunning = false;
    var fEndAt = null;
    var fRaf = null;
    function fPaint() {
        var remSec = fRemainingMs / 1000;
        var frac = fTotalSec > 0 ? Math.max(0, remSec / fTotalSec) : 0;
        var offset = CIRC * (1 - frac);
        fRingFg.style.strokeDashoffset = offset;
        fTimeReadout.textContent = fmt(remSec);
        var warn = remSec <= 10 && remSec > 0;
        fTimeReadout.classList.toggle('warn', warn);
        fRingFg.classList.toggle('warn', warn);
        fTimeStatus.textContent = fRunning ? "Läuft" : (remSec <= 0 ? "Fertig" : "Pausiert");
    }
    function fSetTotal(sec) {
        fTotalSec = sec;
        fRemainingMs = sec * 1000;
        fStop();
        fPaint();
    }
    function fTick() {
        if (!fRunning)
            return;
        fRemainingMs = Math.max(0, fEndAt - performance.now());
        fPaint();
        if (fRemainingMs <= 0) {
            fFinish();
            return;
        }
        fRaf = requestAnimationFrame(fTick);
    }
    function fStart() {
        if (fRunning)
            return;
        if (fRemainingMs <= 0) {
            fRemainingMs = fTotalSec * 1000;
        }
        fRunning = true;
        fEndAt = performance.now() + fRemainingMs;
        fStartBtn.textContent = "Pause";
        fRaf = requestAnimationFrame(fTick);
        fPaint();
    }
    function fPause() {
        fRunning = false;
        cancelAnimationFrame(fRaf);
        fStartBtn.textContent = "Start";
        fPaint();
    }
    function fStop() {
        fRunning = false;
        cancelAnimationFrame(fRaf);
        fStartBtn.textContent = "Start";
    }
    function fFinish() {
        fRunning = false;
        cancelAnimationFrame(fRaf);
        fRemainingMs = 0;
        fStartBtn.textContent = "Start";
        fPaint();
        beepFinish();
    }
    fStartBtn.addEventListener('click', function () { return fRunning ? fPause() : fStart(); });
    fResetBtn.addEventListener('click', function () { fStop(); fRemainingMs = fTotalSec * 1000; fPaint(); });
    fPresetsWrap.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
            fPresetsWrap.querySelectorAll('.chip').forEach(function (c) { return c.classList.remove('active'); });
            chip.classList.add('active');
            var sec = parseInt(chip.dataset.sec, 10);
            document.getElementById('fCustomMin').value = Math.floor(sec / 60);
            document.getElementById('fCustomSec').value = sec % 60;
            fSetTotal(sec);
        });
    });
    document.getElementById('fApplyCustomBtn').addEventListener('click', function () {
        var m = parseInt(document.getElementById('fCustomMin').value, 10) || 0;
        var s = parseInt(document.getElementById('fCustomSec').value, 10) || 0;
        var sec = Math.max(1, m * 60 + s);
        fPresetsWrap.querySelectorAll('.chip').forEach(function (c) { return c.classList.remove('active'); });
        fSetTotal(sec);
    });
    function fAdjust(deltaSec) {
        fTotalSec = Math.max(5, fTotalSec + deltaSec);
        fRemainingMs = Math.max(0, fRemainingMs + deltaSec * 1000);
        if (fRunning) {
            fEndAt = performance.now() + fRemainingMs;
        }
        fPresetsWrap.querySelectorAll('.chip').forEach(function (c) { return c.classList.remove('active'); });
        fPaint();
    }
    document.getElementById('fPlus10').addEventListener('click', function () { return fAdjust(10); });
    document.getElementById('fPlus30').addEventListener('click', function () { return fAdjust(30); });
    document.getElementById('fMinus10').addEventListener('click', function () { return fAdjust(-10); });
    document.getElementById('fMinus30').addEventListener('click', function () { return fAdjust(-30); });
    fSetTotal(60);
    /* ================= Fullscreen overlay ================= */
    var fsOverlayEl = document.getElementById('fsOverlay');
    var fsToggle = document.getElementById('fsToggle');
    var fsClose = document.getElementById('fsClose');
    function openFS() {
        fsFocus.textContent = currentPlan.focus || (activeTab === 'circuit' ? 'Zirkel' : 'Timer');
        fsOverlayEl.classList.add('active');
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(function () { });
        }
    }
    function closeFS() {
        fsOverlayEl.classList.remove('active');
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(function () { });
        }
    }
    fsToggle.addEventListener('click', openFS);
    fsClose.addEventListener('click', closeFS);
    document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) {
            fsOverlayEl.classList.remove('active');
        }
    });
    document.addEventListener('keydown', function (e) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA')
            return;
        if (e.code === 'Space') {
            e.preventDefault();
            if (activeTab === 'circuit') {
                circuitRunning ? pauseCircuit() : startCircuit();
            }
            else {
                fRunning ? fPause() : fStart();
            }
        }
        else if (e.key === 'Escape' && fsOverlayEl.classList.contains('active')) {
            closeFS();
        }
    });
    /* ================= Init ================= */
    loadIntoUI(todayISO());
})();
